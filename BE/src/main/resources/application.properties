spring.application.name=CodeGenie
spring.profiles.include=secure
spring.messages.encoding=UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ===============================
#  Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/codegenie_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=codegenie
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
#  JPA 설정
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
#  Spring AI - OpenAI 설정
# ===============================
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.6


# ===============================
#  Server
# ===============================
server.port=8080

# Spring Security 디버그
logging.level.org.springframework.security=DEBUG
# (선택) 스프링 MVC 요청 로깅
logging.level.org.springframework.web=INFO
# (선택) 요청/응답 헤더까지 보고 싶다면
spring.mvc.log-request-details=true
